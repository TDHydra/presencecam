<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13">
  <title>PresenceCam wiring: ESP32 NodeMCU, OLED and radar</title>
  <rect width="860" height="470" rx="14" fill="#ffffff"/>
  <style>
    .lbl{fill:#1d2330}.mut{fill:#667085;font-size:12px}.pin{fill:#1d2330;font-size:12px;font-family:Consolas,Menlo,monospace}
    .w{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .pwr{stroke:#d92d20}.v5{stroke:#f79009}.gnd{stroke:#344054}.i2c{stroke:#2563eb}.sig{stroke:#12a150}.tx{stroke:#7a5af8}
  </style>

  <!-- OLED (drawn with its header on the right so the wires run straight) -->
  <rect x="40" y="170" width="180" height="150" rx="10" fill="#101828"/>
  <rect x="54" y="186" width="112" height="118" rx="4" fill="#0b4a6f"/>
  <text x="110" y="240" text-anchor="middle" fill="#7dd3fc" font-size="14" font-weight="600">OLED</text>
  <text x="110" y="258" text-anchor="middle" fill="#7dd3fc" font-size="11">128×64 I²C</text>
  <g class="pin"><text x="210" y="214" fill="#fff" text-anchor="end">GND</text><text x="210" y="244" fill="#fff" text-anchor="end">VCC</text><text x="210" y="274" fill="#fff" text-anchor="end">SCL</text><text x="210" y="304" fill="#fff" text-anchor="end">SDA</text></g>
  <text x="130" y="342" text-anchor="middle" class="mut">SSD1306 0.96" or SH1106 1.3"</text>
  <text x="130" y="358" text-anchor="middle" class="mut">pin order varies, read the labels</text>

  <!-- ESP32 board -->
  <rect x="330" y="40" width="200" height="390" rx="10" fill="#1d2939"/>
  <rect x="385" y="56" width="90" height="70" rx="4" fill="#98a2b3"/>
  <text x="430" y="96" text-anchor="middle" fill="#1d2939" font-size="12" font-weight="700">ESP32</text>
  <rect x="408" y="410" width="44" height="22" rx="4" fill="#d0d5dd"/>
  <text x="430" y="452" text-anchor="middle" class="mut">USB</text>
  <text x="430" y="150" text-anchor="middle" fill="#fff" font-weight="600">ESP32 NodeMCU</text>
  <text x="430" y="168" text-anchor="middle" fill="#d0d5dd" font-size="11">ESP-32S / WROOM-32 devkit</text>
  <!-- left header -->
  <g class="pin">
    <text x="342" y="214" fill="#fff">GND</text>
    <text x="342" y="244" fill="#fff">3V3</text>
    <text x="342" y="274" fill="#fff">D22 SCL</text>
    <text x="342" y="304" fill="#fff">D21 SDA</text>
  </g>
  <!-- right header -->
  <g class="pin">
    <text x="518" y="214" fill="#fff" text-anchor="end">VIN 5V</text>
    <text x="518" y="244" fill="#fff" text-anchor="end">GND</text>
    <text x="518" y="274" fill="#fff" text-anchor="end">D16 RX2</text>
    <text x="518" y="304" fill="#fff" text-anchor="end">D17 TX2</text>
    <text x="518" y="334" fill="#fff" text-anchor="end">D27</text>
  </g>
  <g fill="#fcd34d"><circle cx="330" cy="210" r="4"/><circle cx="330" cy="240" r="4"/><circle cx="330" cy="270" r="4"/><circle cx="330" cy="300" r="4"/>
  <circle cx="530" cy="210" r="4"/><circle cx="530" cy="240" r="4"/><circle cx="530" cy="270" r="4"/><circle cx="530" cy="300" r="4"/><circle cx="530" cy="330" r="4"/></g>

  <!-- OLED wires -->
  <g fill="#fcd34d"><circle cx="220" cy="210" r="4"/><circle cx="220" cy="240" r="4"/><circle cx="220" cy="270" r="4"/><circle cx="220" cy="300" r="4"/></g>
  <path class="w gnd" d="M220 210 H330"/>
  <path class="w pwr" d="M220 240 H330"/>
  <path class="w i2c" d="M220 270 H330" stroke-dasharray="7 4"/>
  <path class="w i2c" d="M220 300 H330"/>

  <!-- LD2410 -->
  <rect x="640" y="146" width="190" height="214" rx="10" fill="#14532d"/>
  <text x="735" y="172" text-anchor="middle" fill="#fff" font-size="15" font-weight="600">HLK-LD2410</text>
  <text x="735" y="189" text-anchor="middle" fill="#bbf7d0" font-size="11">24 GHz mmWave radar (B or C)</text>
  <g class="pin"><text x="652" y="214" fill="#fff">VCC</text><text x="652" y="244" fill="#fff">GND</text><text x="652" y="274" fill="#fff">TX</text><text x="652" y="304" fill="#fff">RX</text><text x="652" y="334" fill="#fff">OUT</text></g>
  <g fill="#fcd34d"><circle cx="640" cy="210" r="4"/><circle cx="640" cy="240" r="4"/><circle cx="640" cy="270" r="4"/><circle cx="640" cy="300" r="4"/><circle cx="640" cy="330" r="4"/></g>
  <path class="w v5" d="M530 210 H640"/>
  <path class="w gnd" d="M530 240 H640"/>
  <path class="w tx" d="M530 270 H640"/>
  <path class="w tx" d="M530 300 H640" stroke-dasharray="7 4"/>
  <path class="w sig" d="M530 330 H640"/>
  <text x="735" y="390" text-anchor="middle" class="mut">RCWL-0516 instead? Wire only</text>
  <text x="735" y="406" text-anchor="middle" class="mut">VIN → 5V, GND → GND, OUT → D27</text>

  <!-- legend -->
  <g font-size="12">
    <text x="30" y="30" class="lbl" font-weight="700" font-size="16">PresenceCam wiring</text>
    <line x1="30" y1="385" x2="54" y2="385" class="w pwr"/><text x="60" y="389" class="lbl">3.3 V</text>
    <line x1="110" y1="385" x2="134" y2="385" class="w v5"/><text x="140" y="389" class="lbl">5 V</text>
    <line x1="180" y1="385" x2="204" y2="385" class="w gnd"/><text x="210" y="389" class="lbl">GND</text>
    <line x1="30" y1="410" x2="54" y2="410" class="w i2c"/><text x="60" y="414" class="lbl">I²C (SDA solid, SCL dashed)</text>
    <line x1="30" y1="435" x2="54" y2="435" class="w tx"/><text x="60" y="439" class="lbl">UART, crossed: TX→RX2, RX→TX2</text>
    <line x1="30" y1="460" x2="54" y2="460" class="w sig"/><text x="60" y="464" class="lbl">presence OUT</text>
  </g>
</svg>
