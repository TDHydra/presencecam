name: Build firmware and web flasher

# Manual only, so pushes and tags never use Actions minutes on their own. For a release, tag
# it, push the tag, then run the workflow on that tag (it attaches the firmware to the release):
#   git tag v2.1.0 && git push origin v2.1.0 && gh workflow run build.yml --ref v2.1.0
# Normally releases are published from the dev server with tools/build.sh --publish instead,
# which deploys Pages from the gh-pages branch; this workflow is a spare. Day-to-day testing
# happens locally with tools/serve.sh.
on:
  workflow_dispatch:

permissions:
  contents: write   # attach files to releases
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.platformio-arduino2
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Tests, firmware (every chip, Arduino core 3 and core 2) and the site
        run: tools/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: presencecam-firmware
          path: |
            _site/firmware/*.bin
            _site/manifest.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Attach firmware to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: _site/firmware/*.bin

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
