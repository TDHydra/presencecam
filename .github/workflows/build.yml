name: Build firmware and web flasher

# Runs only for releases: push a v* tag (git tag v2.1.0 && git push origin v2.1.0), or start
# it by hand from the Actions tab. Day-to-day testing happens locally with tools/serve.sh.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # attach files to releases
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test the pin allocator
        run: node --test site/test/*.test.mjs

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware (ESP32 and ESP32-S3)
        run: pio run

      - name: Assemble web flasher site
        run: python tools/make_site.py .pio/build _site

      - uses: actions/upload-artifact@v4
        with:
          name: presencecam-firmware
          path: |
            _site/firmware/*.bin
            _site/manifest.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Attach firmware to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: _site/firmware/*.bin

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
