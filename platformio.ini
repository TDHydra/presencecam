; PresenceCam firmware. One build per chip; the board, sensors, display and layout are
; chosen at runtime from a hardware config (sent by the web flasher, see src/hwconfig.h).
;
; Build:  pio run                     (ESP32 + ESP32-S3)   pio run -e esp32   (one)
;         ESP32-P4: PLATFORMIO_CORE_DIR=~/.platformio-p4 PLATFORMIO_BUILD_DIR=.pio/build-p4 \
;                   pio run -e esp32p4 -e esp32p4r3
;         (its platform's packages clash with espressif32@6.9.0, so it gets its own core and build dir)
; Flash:  pio run -e esp32 -t upload  Monitor: pio device monitor
; The merged image for the web flasher lands in .pio/build/<env>/presencecam-merged.bin

[platformio]
default_envs = esp32, esp32s3

[common]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    olikraus/U8g2@^2.35.30
    lovyan03/LovyanGFX@^1.1.16
    bblanchon/ArduinoJson@^7.2.1
    pololu/VL53L0X@^1.3.1
build_flags =
    -DCORE_DEBUG_LEVEL=0
extra_scripts =
    pre:tools/version.py
    post:tools/merge_bin.py

; ESP32 DevKit / NodeMCU ESP-32S (30 or 38 pin), 4 MB flash
[env:esp32]
extends = common
board = nodemcu-32s
board_build.partitions = min_spiffs.csv   ; 1.9 MB app slots (OTA), 190 KB for the log
board_build.filesystem = littlefs
upload_speed = 921600

; ESP32-S3 boards, e.g. Waveshare ESP32-S3-LCD-1.47B (16 MB flash, 8 MB octal PSRAM, native USB)
[env:esp32s3]
extends = common
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
build_flags =
    ${common.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-P4 boards with Ethernet and no Wi-Fi, e.g. Waveshare ESP32-P4-ETH / ESP32-P4-POE-ETH
; (32 MB flash, 32 MB PSRAM, IP101 PHY, CH343 USB serial on UART0). The P4 needs Arduino
; core 3 (pioarduino). Chips before revision 3.0 (v1.x) and v3.x need different builds.
[p4]
extends = common
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
build_flags =
    ${common.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0

[env:esp32p4]
extends = p4
board = esp32-p4

[env:esp32p4r3]
extends = p4
board = esp32-p4_r3
