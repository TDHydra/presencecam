; PresenceCam firmware for an ESP32 NodeMCU (ESP-32S / ESP32-WROOM-32 devkit).
; Build:  pio run              Flash over USB:  pio run -t upload
; Monitor: pio device monitor
; The merged image for the web flasher lands in .pio/build/nodemcu-32s/presencecam-merged.bin

[platformio]
default_envs = nodemcu-32s

[env:nodemcu-32s]
platform = espressif32@6.9.0
board = nodemcu-32s
framework = arduino
board_build.partitions = default.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
lib_deps =
    olikraus/U8g2@^2.35.30
build_flags =
    -DCORE_DEBUG_LEVEL=0
extra_scripts =
    pre:tools/version.py
    post:tools/merge_bin.py
