; PresenceCam firmware. One build per chip; the board, sensors, display and layout are
; chosen at runtime from a hardware config (sent by the web flasher, see src/hwconfig.h).
;
; Build:  tools/build.sh              (every build)  pio run -e esp32   (one)
; Flash:  pio run -e esp32 -t upload  Monitor: pio device monitor
; The merged image for the web flasher lands in .pio/build/<env>/presencecam-merged.bin
;
; Two Arduino cores:
; - core 3 (pioarduino platform): every chip; the ESP32-C6, ESP32-P4 and Ethernet need it.
;   These are the default envs: `pio run` builds them.
; - core 2 (espressif32@6.9.0): the *-core2 envs for ESP32, ESP32-S3 and ESP32-C3, Wi-Fi only.
;   The two platforms' packages clash, so these build in their own core and build directory:
;   PLATFORMIO_CORE_DIR=~/.platformio-arduino2 PLATFORMIO_BUILD_DIR=.pio/build-core2 \
;     pio run -e esp32-core2 -e esp32s3-core2 -e esp32c3-core2      (tools/build.sh does this)

[platformio]
default_envs = esp32, esp32s3, esp32c3, esp32c6, esp32p4, esp32p4r3

[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    olikraus/U8g2@^2.35.30
    lovyan03/LovyanGFX@^1.1.16
    bblanchon/ArduinoJson@^7.2.1
    pololu/VL53L0X@^1.3.1
    pololu/VL53L1X@^1.3.1
build_flags =
    -DCORE_DEBUG_LEVEL=0
; Arducam_Mega 2.0.9 is vendored in lib/ (MIT): the registry copy returns a value from a void
; function, which Arduino core 3's compiler rejects.
extra_scripts =
    pre:tools/version.py
    post:tools/merge_bin.py

; ESP32 DevKit / NodeMCU ESP-32S (30 or 38 pin), AI-Thinker ESP32-CAM; 4 MB flash
[env:esp32]
extends = common
board = nodemcu-32s
board_build.partitions = min_spiffs.csv   ; 1.9 MB app slots (OTA), 128 KB for the log and photos
board_build.filesystem = littlefs
upload_speed = 921600

; ESP32-S3 boards, e.g. Waveshare ESP32-S3-LCD-1.47B / 1.69 / ETH (16 MB flash, 8 MB octal
; PSRAM, native USB)
[env:esp32s3]
extends = common
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
build_flags =
    ${common.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-C3 boards with native USB, e.g. Seeed XIAO ESP32-C3 (4 MB flash)
[env:esp32c3]
extends = common
board = esp32-c3-devkitm-1
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
build_flags =
    ${common.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-C6 boards with native USB, e.g. Seeed XIAO ESP32-C6, Waveshare ESP32-C6-LCD-1.47
; (4 MB flash)
[env:esp32c6]
extends = common
board = esp32-c6-devkitc-1
board_upload.flash_size = 4MB
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
build_flags =
    ${common.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-P4 boards with Ethernet and no Wi-Fi, e.g. Waveshare ESP32-P4-ETH / ESP32-P4-POE-ETH
; (32 MB flash, 32 MB PSRAM, IP101 PHY, CH343 USB serial on UART0). Chips before revision
; 3.0 (v1.x) and v3.x need different builds.
[p4]
extends = common
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
build_flags =
    ${common.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0

[env:esp32p4]
extends = p4
board = esp32-p4

[env:esp32p4r3]
extends = p4
board = esp32-p4_r3

; --- Arduino core 2 builds (see the top of this file) ---

[core2]
platform = espressif32@6.9.0

[env:esp32-core2]
extends = env:esp32
platform = ${core2.platform}

[env:esp32s3-core2]
extends = env:esp32s3
platform = ${core2.platform}

[env:esp32c3-core2]
extends = env:esp32c3
platform = ${core2.platform}
